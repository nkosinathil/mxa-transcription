# Nginx Reverse Proxy Configuration (optional)
#
# Plain-language:
#   If you want to put Nginx in front of the Python FastAPI server (e.g. for
#   HTTPS termination or rate limiting), use this configuration.
#   Place this file at: /etc/nginx/sites-available/transcription-api.conf
#
# Enable:
#   sudo ln -s /etc/nginx/sites-available/transcription-api.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream transcription_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name 192.168.1.90;

    # Forward all /api/* requests to the Python FastAPI server
    location /api/ {
        proxy_pass         http://transcription_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Allow large file uploads (match max_upload_bytes in .env)
        client_max_body_size 510M;

        # Longer timeout for uploads and long-running requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Deny all other requests to this server
    location / {
        return 404;
    }
}

