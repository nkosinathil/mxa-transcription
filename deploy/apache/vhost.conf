# Apache Virtual Host Configuration
# File: /etc/apache2/sites-available/transcription.conf
#
# Plain-language:
#   This file tells Apache how to serve the PHP web application.
#   It routes all requests to the php-app/public/ directory and
#   enables the URL rewriting needed by our front controller (index.php).
#
# To enable:
#   sudo cp transcription.conf /etc/apache2/sites-available/
#   sudo a2ensite transcription.conf
#   sudo a2enmod rewrite headers
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName 192.168.1.66
    # Add a ServerAlias if you have a hostname, e.g.:
    # ServerAlias transcription.internal

    # DocumentRoot must point to the public/ subfolder, NOT the project root.
    # This is important for security – vendor/, src/, and .env are not web-accessible.
    DocumentRoot /var/www/gismartanalytics/public

    <Directory /var/www/gismartanalytics/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM socket (adjust the socket path for your server)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/transcription_error.log
    CustomLog ${APACHE_LOG_DIR}/transcription_access.log combined

    # Security headers (supplement the .htaccess headers)
    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
    Header always set Permissions-Policy "microphone=(), camera=()"

</VirtualHost>

